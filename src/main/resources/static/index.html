
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 3-Tier Application</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }
        header {
            background: #123b68;
            color: white;
            padding: 24px 8%;
        }
        header h1 { margin: 0; font-size: 26px; }
        header p { margin-bottom: 0; color: #dbeafe; }
        main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 16px #0000000d;
        }
        .status { color: #15803d; font-weight: bold; }
        button {
            background: #1769aa;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
        }
        #result { margin-top: 16px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <header>
        <h1>Java 3-Tier Application</h1>
        <p>Frontend · Java Backend · Database</p>
    </header>

    <main>
        <section class="card">
            <h2>Welcome to our Azure application</h2>
            <p>This is the frontend of our Java 3-tier project.</p>
            <p>Frontend status: <span class="status">Loaded</span></p>
            <button id="checkButton">Check Backend</button>
            <div id="result" aria-live="polite"></div>
        </section>
    </main>

    <script>
        document.getElementById("checkButton").addEventListener("click", async () => {
            const result = document.getElementById("result");
            result.textContent = "Checking backend...";
            try {
                const response = await fetch("/api/health");
                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                result.textContent = "Backend status: " + data.status;
            } catch (error) {
                result.textContent = "Backend endpoint is not configured yet. We will add it next.";
            }
        });
    </script>
</body>
</html>
